kind = "web"
previewPath = "/"
title = "e-IRF: Electronic Incident Records Form"
version = "1.0.0"
id = "artifacts/eirf"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20328

[services.development]
run = "pnpm --filter @workspace/eirf run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/eirf", "run", "build" ]
serve = "static"
publicDir = "artifacts/eirf/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20328"
BASE_PATH = "/"
